global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: "http://proxy.us-west-2.telemetry-nonprod.zg-int.net:3030/remote/write"
    remote_timeout: 30s
    queue_config:
      capacity: 2500
      max_shards: 200
      max_samples_per_send: 500

scrape_configs:
  - job_name: 'av-metrics'
    static_configs:
      - targets: ['av-collector:3000']
    metrics_path: '/metrics'
