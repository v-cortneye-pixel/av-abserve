name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: av-observe-main

jobs:
  # ---------------------------------------------------------------------------
  # syntax-check: no install required, fast feedback on broken JS.
  # ---------------------------------------------------------------------------
  syntax-check:
    name: Syntax check (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: av-observe-main/.nvmrc
      - name: node --check on all .js / .mjs files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f"; then
              echo "::error file=$f::Syntax error"
              fail=1
            fi
          done < <(find . \
              -type d \( -name node_modules -o -name .ignore -o -name .data \
                       -o -path ./apps/av-alerts-api/code \
                       -o -path ./apps/av-alerts-api/temp-package \) -prune -false \
              -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          exit "$fail"

  # ---------------------------------------------------------------------------
  # install: shared dependency install + cache, depended on by lint/audit/test.
  # ---------------------------------------------------------------------------
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: av-observe-main/.nvmrc
          cache: npm
          cache-dependency-path: av-observe-main/package-lock.json
      - name: npm ci
        run: npm ci --ignore-scripts

  # ---------------------------------------------------------------------------
  # lint: ESLint + Prettier check. Advisory until the team is ready to make
  # findings blocking. ESLint + Prettier are now in devDependencies, but the
  # existing codebase has not been auto-formatted, so 'format:check' will
  # produce findings. Flip continue-on-error to false once the codebase is
  # reformatted (see MAINTENANCE.md).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format check (advisory)
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: av-observe-main/.nvmrc
          cache: npm
          cache-dependency-path: av-observe-main/package-lock.json
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Prettier (check only)
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # unit: Node's built-in test runner; no devDeps required.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests (node --test)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: av-observe-main/.nvmrc
          cache: npm
          cache-dependency-path: av-observe-main/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:unit

  # ---------------------------------------------------------------------------
  # audit: non-blocking npm audit summary.
  # ---------------------------------------------------------------------------
  audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: av-observe-main/.nvmrc
          cache: npm
          cache-dependency-path: av-observe-main/package-lock.json
      - run: npm ci --ignore-scripts
      - name: npm audit --omit=dev
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # secret-scan: trip-wire for accidentally committed secrets, including any
  # values pasted into .env.example.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Heuristic secret check on .env.example
        shell: bash
        run: |
          set -euo pipefail
          file=av-observe-main/.env.example
          if [ ! -f "$file" ]; then
            echo "::warning::$file not present, skipping"
            exit 0
          fi
          # Flag any line that has an assignment with a non-empty value that
          # is not just a placeholder. Keys must be empty in .env.example.
          if grep -E '^[A-Z_][A-Z0-9_]*=.+$' "$file" \
              | grep -vE '=(\s*|#.*|TODO.*)$' \
              | grep -vE '^\s*#'; then
            echo "::error file=$file::.env.example should not contain real values"
            exit 1
          fi
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
